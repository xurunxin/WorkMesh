name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '0 19 * * 0'
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Classify changes and validate CI selection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.scope.outputs.plan }}
      packages: ${{ steps.scope.outputs.packages }}
      test-packages: ${{ steps.scope.outputs.test-packages }}
      source-gates: ${{ steps.scope.outputs.source-gates }}
      db-integration: ${{ steps.scope.outputs.db-integration }}
      api-integration: ${{ steps.scope.outputs.api-integration }}
      worker-integration: ${{ steps.scope.outputs.worker-integration }}
      recovery-integration: ${{ steps.scope.outputs.recovery-integration }}
      agent-smoke: ${{ steps.scope.outputs.agent-smoke }}
      connector-platform: ${{ steps.scope.outputs.connector-platform }}
      connector-install: ${{ steps.scope.outputs.connector-install }}
    steps:
      - name: Check out comparison history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up exact Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Validate selection and required-result safety
        run: |
          mkdir -p ci-logs
          set -o pipefail
          npm ci --prefix scripts/ci-bootstrap --ignore-scripts --no-audit --no-fund 2>&1 | tee ci-logs/ci-bootstrap.log
          node --test scripts/ci-policy.test.mjs 2>&1 | tee ci-logs/ci-policy.log
          node scripts/check-integration-docs.mjs 2>&1 | tee ci-logs/integration-docs.log
      - name: Select required jobs
        id: scope
        run: |
          set -o pipefail
          node scripts/ci-policy.mjs 2>&1 | tee ci-logs/ci-plan.log
      - name: Upload change classification logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: changes-raw-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-logs
          if-no-files-found: error
          retention-days: 14

  source-gates:
    name: Source gates
    needs: changes
    if: ${{ needs.changes.outputs.source-gates == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI_PACKAGES: ${{ needs.changes.outputs.packages }}
      CI_TEST_PACKAGES: ${{ needs.changes.outputs.test-packages }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up exact Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Derive test-only bootstrap credential
        run: node scripts/set-ci-bootstrap-token.mjs source-gates
      - name: Activate exact pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm --version
      - name: Restore pnpm store cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: |
          mkdir -p ci-logs
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee ci-logs/install.log
      - name: Restore trusted static and compiler caches
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            .turbo/typecheck
          key: source-v2-${{ runner.os }}-node22-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            source-v2-${{ runner.os }}-node22-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Validate CI policy
        run: |
          set -o pipefail
          pnpm ci:validate 2>&1 | tee ci-logs/ci-validate.log
      - name: Lint
        run: |
          set -o pipefail
          pnpm ci:source lint 2>&1 | tee ci-logs/lint.log
      - name: Typecheck
        run: |
          set -o pipefail
          pnpm ci:source typecheck 2>&1 | tee ci-logs/typecheck.log
      - name: Verify generated route policy and signed WorkMesh Skill
        run: |
          set -o pipefail
          python -B scripts/test-agent-discovery-generation.py 2>&1 | tee ci-logs/discovery-generation.log
          pnpm check:route-policy 2>&1 | tee ci-logs/route-policy.log
          pnpm check:workmesh-skill 2>&1 | tee ci-logs/workmesh-skill.log
          pnpm check:runner-skill 2>&1 | tee ci-logs/runner-skill.log
      - name: Build
        run: |
          set -o pipefail
          pnpm ci:source build 2>&1 | tee ci-logs/build.log
      - name: Unit tests
        run: |
          set -o pipefail
          pnpm ci:source test 2>&1 | tee ci-logs/test.log
      - name: Validate Compose
        run: |
          set -o pipefail
          docker compose config --quiet
          printf '%s\n' 'Compose configuration is valid.' | tee ci-logs/compose-config.log
      # 开发镜像的安装前输入不同于生产镜像，须实际执行正常 postinstall。
      - name: Build all development images with normal lifecycle hooks
        run: python3 scripts/validate-development-images.py
      - name: Verify backend Lite installation and signed Skill
        env:
          WORKMESH_VALIDATION_OUTPUT: ci-logs/backend-deployment
        run: |
          set -o pipefail
          node scripts/verify-a2-backend-lite.mjs 2>&1 | tee ci-logs/backend-lite-deployment.log
          pnpm validate:production-images 2>&1 | tee ci-logs/backend-production-deployment.log
      - name: Verify clean tracked tree
        run: |
          set -o pipefail
          {
            git diff --exit-code
            git diff --cached --exit-code
            git status --short --untracked-files=no
          } 2>&1 | tee ci-logs/clean-tree.log
      - name: Save trusted static and compiler caches
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            .turbo/typecheck
          key: source-v2-${{ runner.os }}-node22-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
      - name: Upload raw source logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-gates-raw-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-logs
          if-no-files-found: error
          retention-days: 14

  db-integration:
    name: Database integration
    needs: changes
    if: ${{ needs.changes.outputs.db-integration == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUN_INTEGRATION: '1'
      DATABASE_URL: postgres://workmesh:workmesh-ci-postgres@127.0.0.1:5432/workmesh_db_integration_test
      SESSION_SECRET: workmesh-ci-session-secret-database-0001
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: workmesh
          POSTGRES_PASSWORD: workmesh-ci-postgres
          POSTGRES_DB: workmesh_db_integration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workmesh -d workmesh_db_integration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up exact Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Derive test-only bootstrap credential
        run: node scripts/set-ci-bootstrap-token.mjs db-integration
      - name: Activate exact pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm --version
      - name: Restore pnpm store cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: |
          mkdir -p ci-logs
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee ci-logs/install.log
      - name: Run database integration
        run: |
          set -o pipefail
          pnpm test:integration:db 2>&1 | tee ci-logs/db-integration.log
      - name: Capture service logs
        if: ${{ failure() }}
        run: |
          mkdir -p ci-logs/services
          for id in $(docker ps -aq); do
            name="$(docker inspect --format '{{.Name}}' "$id" | sed 's#^/##')"
            docker logs "$id" > "ci-logs/services/${name}.log" 2>&1
          done
      - name: Upload raw database logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: db-integration-raw-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-logs
          if-no-files-found: error
          retention-days: 14

  api-integration:
    name: API integration
    needs: changes
    if: ${{ needs.changes.outputs.api-integration == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RUN_INTEGRATION: '1'
      DATABASE_URL: postgres://workmesh:workmesh-ci-postgres@127.0.0.1:5432/workmesh_api_integration_test
      REDIS_URL: redis://127.0.0.1:6379
      AUTH_RATE_LIMIT_ENDPOINT_BURST: '10000'
      AUTH_RATE_LIMIT_SOCKET_BURST: '10000'
      AUTH_RATE_LIMIT_CLIENT_IP_BURST: '10000'
      AUTH_RATE_LIMIT_SUBJECT_BURST: '1000'
      AUTH_RATE_LIMIT_INSTALL_BURST: '100'
      SESSION_SECRET: workmesh-ci-session-secret-api-00000001
      WORKMESH_MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      # The workbench runner integration test authenticates every runner call with
      # this shared secret, and the route rejects anything shorter than 32 chars.
      WORKMESH_RUNNER_SERVICE_TOKEN: workmesh-ci-runner-service-token-00000001
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_BUCKET: workmesh-artifacts
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: workmesh
      S3_SECRET_ACCESS_KEY: workmesh-ci-minio-password
      S3_FORCE_PATH_STYLE: 'true'
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: workmesh
          POSTGRES_PASSWORD: workmesh-ci-postgres
          POSTGRES_DB: workmesh_api_integration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workmesh -d workmesh_api_integration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up exact Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Derive test-only bootstrap credential
        run: node scripts/set-ci-bootstrap-token.mjs api-integration
      - name: Activate exact pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm --version
      - name: Restore pnpm store cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: |
          mkdir -p ci-logs
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee ci-logs/install.log
      - name: Start artifact storage
        run: |
          set -o pipefail
          {
            docker run --detach --name workmesh-ci-rustfs \
              --publish 9000:9000 \
              --env RUSTFS_ACCESS_KEY=workmesh \
              --env RUSTFS_SECRET_KEY=workmesh-ci-minio-password \
              rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
            ready=false
            for attempt in $(seq 1 30); do
              if curl --fail --silent http://127.0.0.1:9000/health/ready > /dev/null; then
                ready=true
                break
              fi
              sleep 2
            done
            if [ "$ready" != "true" ]; then
              docker logs workmesh-ci-rustfs
              exit 1
            fi
          } 2>&1 | tee ci-logs/rustfs-start.log
      - name: Initialize artifact bucket
        run: |
          set -o pipefail
          {
            # The server image ships curl with --aws-sigv4, so bucket creation needs no
            # second image. A 409 means the bucket is already owned by us, which keeps
            # this step idempotent the way `mc mb --ignore-existing` was.
            status=$(docker run --rm --network host \
              --entrypoint /usr/bin/curl \
              rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff \
              --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --aws-sigv4 'aws:amz:us-east-1:s3' \
              --user 'workmesh:workmesh-ci-minio-password' \
              --request PUT 'http://127.0.0.1:9000/workmesh-artifacts')
            case "$status" in
              200|409) printf '%s\n' "artifact bucket ready (HTTP $status)" ;;
              *) printf '%s\n' "artifact bucket initialization failed (HTTP $status)"; exit 1 ;;
            esac
          } 2>&1 | tee ci-logs/rustfs-init.log
      - name: Run API integration
        run: |
          set -o pipefail
          pnpm test:integration:api 2>&1 | tee ci-logs/api-integration.log
      - name: Run real MCP and Pi conformance
        run: |
          mkdir -p ci-logs/mcp-coverage
          set -o pipefail
          pnpm test:conformance:integration 2>&1 | tee ci-logs/mcp-coverage/conformance.log
      - name: Capture service logs
        if: ${{ failure() }}
        run: |
          mkdir -p ci-logs/services
          for id in $(docker ps -aq); do
            name="$(docker inspect --format '{{.Name}}' "$id" | sed 's#^/##')"
            docker logs "$id" > "ci-logs/services/${name}.log" 2>&1
          done
      - name: Upload raw API logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: api-integration-raw-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-logs
          if-no-files-found: error
          retention-days: 14

  worker-integration:
    name: Worker integration
    needs: changes
    if: ${{ needs.changes.outputs.worker-integration == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RUN_INTEGRATION: '1'
      DATABASE_URL: postgres://workmesh:workmesh-ci-postgres@127.0.0.1:5432/workmesh_worker_integration_test
      SESSION_SECRET: workmesh-ci-session-secret-worker-0001
      WORKMESH_MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: workmesh
          POSTGRES_PASSWORD: workmesh-ci-postgres
          POSTGRES_DB: workmesh_worker_integration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workmesh -d workmesh_worker_integration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up exact Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Derive test-only bootstrap credential
        run: node scripts/set-ci-bootstrap-token.mjs worker-integration
      - name: Activate exact pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm --version
      - name: Restore pnpm store cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: |
          mkdir -p ci-logs
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee ci-logs/install.log
      - name: Run worker integration
        run: |
          set -o pipefail
          pnpm test:integration:worker 2>&1 | tee ci-logs/worker-integration.log
      - name: Capture service logs
        if: ${{ failure() }}
        run: |
          mkdir -p ci-logs/services
          for id in $(docker ps -aq); do
            name="$(docker inspect --format '{{.Name}}' "$id" | sed 's#^/##')"
            docker logs "$id" > "ci-logs/services/${name}.log" 2>&1
          done
      - name: Upload raw worker logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: worker-integration-raw-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-logs
          if-no-files-found: error
          retention-days: 14

  recovery-integration:
    name: Complete disaster recovery
    needs: changes
    if: ${{ needs.changes.outputs.recovery-integration == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RUN_INTEGRATION: '1'
      RUN_RECOVERY_INTEGRATION: '1'
      RECOVERY_TEST_SUFFIX: ci
      RECOVERY_SOURCE_DATABASE_URL: postgres://workmesh:WmCiRecoveryPg_2026_A7f9K2m4Q8v6@127.0.0.1:5432/workmesh_recovery_source_test
      RECOVERY_TARGET_DATABASE_URL: postgres://workmesh:WmCiRecoveryPg_2026_A7f9K2m4Q8v6@127.0.0.1:5432/workmesh_recovery_target_test
      RECOVERY_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      RECOVERY_TEST_S3_ACCESS_KEY_ID: workmesh
      RECOVERY_TEST_S3_SECRET_ACCESS_KEY: WmCiRecoveryS3_2026_Z8k4P6n2R9t5
      RECOVERY_SOURCE_S3_BUCKET: workmesh-recovery-source-test
      RECOVERY_TARGET_S3_BUCKET: workmesh-recovery-target-test
      WORKMESH_POSTGRES_TOOL_CONTAINER: workmesh-ci-recovery-postgres
      WORKMESH_POSTGRES_TOOL_HOST: 127.0.0.1
      WORKMESH_POSTGRES_TOOL_PORT: '5432'
      DATABASE_URL: postgres://workmesh:WmCiRecoveryPg_2026_A7f9K2m4Q8v6@127.0.0.1:5432/workmesh_recovery_target_test
      REDIS_URL: redis://127.0.0.1:6379
      SESSION_SECRET: workmesh-ci-recovery-session-secret-00000001
      WORKMESH_MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      WORKMESH_BUILD_SHA: ${{ github.sha }}
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_BUCKET: workmesh-recovery-target-test
      S3_ACCESS_KEY_ID: workmesh
      S3_SECRET_ACCESS_KEY: WmCiRecoveryS3_2026_Z8k4P6n2R9t5
      S3_FORCE_PATH_STYLE: 'true'
      WEB_ORIGIN: http://127.0.0.1:3001
      WORKER_HEALTH_HOST: 127.0.0.1
      WORKER_HEALTH_PORT: '3003'
      RECOVERY_SMOKE_AGENT_TOKEN: workmesh-recovery-agent-session-token
      RECOVERY_TEST_REPORT_PATH: ${{ github.workspace }}/ci-logs/recovery-report.json
      RECOVERY_SMOKE_REPORT_PATH: ${{ github.workspace }}/ci-logs/recovery-service-smoke.json
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up exact Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Derive test-only bootstrap credential
        run: node scripts/set-ci-bootstrap-token.mjs recovery-integration
      - name: Activate exact pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm --version
      - name: Restore pnpm store cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: |
          mkdir -p ci-logs
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee ci-logs/install.log
      - name: Start isolated recovery infrastructure
        run: |
          set -o pipefail
          {
            docker run --detach --name workmesh-ci-recovery-postgres \
              --env POSTGRES_USER=workmesh \
              --env POSTGRES_PASSWORD=WmCiRecoveryPg_2026_A7f9K2m4Q8v6 \
              --env POSTGRES_DB=workmesh_recovery_source_test \
              --publish 5432:5432 \
              postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
            docker run --detach --name workmesh-ci-recovery-rustfs \
              --env RUSTFS_ACCESS_KEY=workmesh \
              --env RUSTFS_SECRET_KEY=WmCiRecoveryS3_2026_Z8k4P6n2R9t5 \
              --publish 9000:9000 \
              rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
            docker run --detach --name workmesh-ci-recovery-redis \
              --publish 6379:6379 redis:7-alpine
            for attempt in $(seq 1 30); do
              if docker exec workmesh-ci-recovery-postgres pg_isready -U workmesh -d workmesh_recovery_source_test \
                && curl --fail --silent http://127.0.0.1:9000/health/ready > /dev/null \
                && docker exec workmesh-ci-recovery-redis redis-cli ping | grep -q PONG; then
                break
              fi
              if [ "$attempt" = 30 ]; then exit 1; fi
              sleep 2
            done
            docker exec workmesh-ci-recovery-postgres \
              createdb -U workmesh workmesh_recovery_target_test
          } 2>&1 | tee ci-logs/infrastructure.log
      - name: Build restored production images
        run: |
          set -o pipefail
          {
            docker build --build-arg WORKMESH_BUILD_SHA="${{ github.sha }}" \
              --file infra/docker/api.production.Dockerfile \
              --tag "workmesh-ci-recovery-api:${{ github.sha }}" .
            docker build --build-arg WORKMESH_BUILD_SHA="${{ github.sha }}" \
              --file infra/docker/worker.production.Dockerfile \
              --tag "workmesh-ci-recovery-worker:${{ github.sha }}" .
            docker build --build-arg WORKMESH_BUILD_SHA="${{ github.sha }}" \
              --file infra/docker/mcp.production.Dockerfile \
              --tag "workmesh-ci-recovery-mcp:${{ github.sha }}" .
          } 2>&1 | tee ci-logs/build.log
      - name: Run destructive recovery matrix
        run: |
          set -o pipefail
          pnpm --filter @workmesh/recovery test:integration 2>&1 | tee ci-logs/recovery-integration.log
      - name: Start restored services and run Agent workflow smoke
        run: |
          set -o pipefail
          docker run --detach --name workmesh-ci-recovery-api --network host \
            --env DATABASE_URL --env REDIS_URL --env SESSION_SECRET --env WORKMESH_MASTER_KEY \
            --env WORKMESH_BOOTSTRAP_TOKEN --env PAGINATION_CURSOR_KEYS --env PAGINATION_CURSOR_ACTIVE_KID \
            --env AUTH_RATE_LIMIT_HMAC_KEY --env WEB_ORIGIN --env S3_ENDPOINT --env S3_REGION \
            --env S3_BUCKET --env S3_ACCESS_KEY_ID --env S3_SECRET_ACCESS_KEY --env S3_FORCE_PATH_STYLE \
            "workmesh-ci-recovery-api:${{ github.sha }}"
          docker run --detach --name workmesh-ci-recovery-worker --network host \
            --env DATABASE_URL --env REDIS_URL --env SESSION_SECRET --env WORKMESH_MASTER_KEY \
            --env S3_ENDPOINT --env S3_REGION --env S3_BUCKET --env S3_ACCESS_KEY_ID \
            --env S3_SECRET_ACCESS_KEY --env S3_FORCE_PATH_STYLE \
            "workmesh-ci-recovery-worker:${{ github.sha }}"
          docker run --detach --name workmesh-ci-recovery-mcp --network host \
            --env WORKMESH_API_URL=http://127.0.0.1:3001 \
            --env WORKMESH_SESSION_TOKEN="$RECOVERY_SMOKE_AGENT_TOKEN" \
            --env WORKMESH_MCP_ACCESS_TOKEN="$AUTH_RATE_LIMIT_HMAC_KEY" \
            "workmesh-ci-recovery-mcp:${{ github.sha }}"
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3001/readyz > /dev/null \
              && curl --fail --silent http://127.0.0.1:3003/readyz > /dev/null \
              && curl --fail --silent http://127.0.0.1:3002/readyz > /dev/null; then
              break
            fi
            if [ "$attempt" = 45 ]; then exit 1; fi
            sleep 2
          done
          RECOVERY_SMOKE_MCP_TOKEN="$AUTH_RATE_LIMIT_HMAC_KEY" pnpm --filter @workmesh/recovery smoke:restored 2>&1 | tee ci-logs/recovery-service-smoke.log
      - name: Capture service logs
        if: ${{ failure() }}
        run: |
          mkdir -p ci-logs/services
          for id in $(docker ps -aq); do
            name="$(docker inspect --format '{{.Name}}' "$id" | sed 's#^/##')"
            docker logs "$id" > "ci-logs/services/${name}.log" 2>&1
          done
      - name: Upload raw recovery logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recovery-integration-raw-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-logs
          if-no-files-found: error
          retention-days: 14

  agent-smoke:
    name: Agent construction and protocol smoke
    needs: changes
    if: ${{ needs.changes.outputs.agent-smoke == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up exact Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Activate exact pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm --version
      - name: Restore pnpm store cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: |
          mkdir -p ci-logs
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee ci-logs/install.log
      - name: Construction and protocol smoke
        run: |
          set -o pipefail
          pnpm smoke:agents:ci 2>&1 | tee ci-logs/agent-smoke.log
          pnpm test:conformance -- --output ../../ci-logs/client-profile-conformance 2>&1 | tee ci-logs/client-profile-conformance.log
      - name: Upload raw agent smoke logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent-smoke-raw-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-logs
          if-no-files-found: error
          retention-days: 14

  connector-platform:
    name: Connector native storage (${{ matrix.os }})
    needs: changes
    if: ${{ needs.changes.outputs.connector-platform == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Enable Windows long paths before checkout
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          git config --global core.longpaths true
          if ($LASTEXITCODE -ne 0) { throw 'long path configuration failed' }
          git config --show-origin --get core.longpaths
          if ($LASTEXITCODE -ne 0) { throw 'long path configuration readback failed' }
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up exact Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Activate exact pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
      - name: Restore pnpm store cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: |
          mkdir -p ci-logs
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee ci-logs/install.log
      - name: Prepare Linux Secret Service
        if: ${{ runner.os == 'Linux' }}
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring dbus-x11
      - name: Bind native runtime source before checks
        id: connector-source-before
        run: node scripts/capture-connector-source.mjs before
      - name: Validate Linux native storage
        if: ${{ runner.os == 'Linux' }}
        run: |
          set -o pipefail
          dbus-run-session -- bash scripts/test-connector-linux.sh 2>&1 | tee ci-logs/connector-platform.log
      - name: Validate macOS native storage
        if: ${{ runner.os == 'macOS' }}
        run: |
          set -o pipefail
          pnpm --filter @workmesh/connector test:platform 2>&1 | tee ci-logs/connector-platform.log
          pnpm --filter @workmesh/connector test 2>&1 | tee ci-logs/connector-unit.log
      - name: Validate Windows native storage with temporary user
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: ./scripts/test-connector-windows.ps1
      - name: Bind native runtime source after checks
        if: ${{ always() && steps.connector-source-before.outcome == 'success' }}
        run: node scripts/capture-connector-source.mjs after
      - name: Upload raw connector logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: connector-platform-raw-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-logs
          if-no-files-found: error
          retention-days: 14

  connector-install:
    name: Connector full installation (${{ matrix.arch }})
    needs: changes
    if: ${{ needs.changes.outputs.connector-install == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      DATABASE_URL: postgres://workmesh:connector-ci-fixture@127.0.0.1:5432/workmesh_connector_install_test
      REDIS_URL: redis://127.0.0.1:6379
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: workmesh
          POSTGRES_PASSWORD: connector-ci-fixture
          POSTGRES_DB: workmesh_connector_install_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U workmesh" --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7.4.5-alpine
        ports: ['6379:6379']
    steps:
      - name: Check out exact product source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up exact Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Activate exact pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
      - name: Restore pnpm store cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Prepare native build and full guest tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 binutils qemu-system-x86 qemu-system-arm qemu-utils qemu-efi-aarch64 genisoimage
          mkdir -p ci-logs/connector-install .tmp
          git show -s --format='%H %T %P' HEAD > ci-logs/connector-install/source.txt
          git cat-file commit HEAD > ci-logs/connector-install/source-commit.txt
          node scripts/capture-connector-source.mjs before
          printf '%s %s %s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$RUNNER_ARCH" > ci-logs/connector-install/run.txt
          sha256sum scripts/connector-install/*.py apps/connector/scripts/*.mjs apps/connector/scripts/*.ts apps/connector/scripts/*.sh > ci-logs/connector-install/input-sha256.txt
      - name: Install source control dependencies
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee ci-logs/connector-install/source-install.log
      - name: Build native self-contained release
        run: |
          set -o pipefail
          pnpm --filter @workmesh/connector build:release -- --output "$PWD/.tmp/connector-release" 2>&1 | tee ci-logs/connector-install/build.log
          pnpm --filter @workmesh/connector build:release -- --output "$PWD/.tmp/connector-upgrade" --release-version 0.1.0-upgrade.1 2>&1 | tee ci-logs/connector-install/upgrade-build.log
      - name: Run installed entry integrity checks
        env:
          WORKMESH_CONNECTOR_ARTIFACTS: ${{ github.workspace }}/.tmp/connector-release
          WORKMESH_CONNECTOR_UPGRADE_ARTIFACTS: ${{ github.workspace }}/.tmp/connector-upgrade
        run: |
          set -o pipefail
          pnpm --filter @workmesh/connector test:install 2>&1 | tee ci-logs/connector-install/install.log
      - name: Execute full no-source product guest
        run: |
          set -euo pipefail
          pnpm exec tsx apps/connector/test-support/install-server.ts > ci-logs/connector-install/server.log 2>&1 &
          echo "$!" > ci-logs/connector-install/server-pid
          for attempt in $(seq 1 180); do
            if test -f ci-logs/connector-install/server-ready; then break; fi
            kill -0 "$(cat ci-logs/connector-install/server-pid)"
            sleep 1
          done
          test -f ci-logs/connector-install/server-ready
          node scripts/verify-connector-install.mjs --artifacts "$PWD/.tmp/connector-release" 2>&1 | tee ci-logs/connector-install/guest.log
      - name: Stop owned fixture and retain bounded receipts
        if: ${{ always() }}
        run: |
          if test -f ci-logs/connector-install/server-pid; then
            pid="$(cat ci-logs/connector-install/server-pid)"
            if kill -0 "$pid" 2>/dev/null; then kill -TERM "$pid"; fi
          fi
          mkdir -p ci-logs/connector-install/receipts
          for file in result.json serial.log qemu-stderr.log; do
            if test -f "ci-logs/connector-install/guest/$file"; then
              cp "ci-logs/connector-install/guest/$file" "ci-logs/connector-install/receipts/$file"
            fi
          done
          if test -f .tmp/connector-release/manifest.json; then
            cp .tmp/connector-release/manifest.json ci-logs/connector-install/receipts/
          fi
          # Guest disks can contain protected test pending/keyring bytes; never upload them.
          if test -d ci-logs/connector-install/guest; then
            case "$(realpath ci-logs/connector-install/guest)" in "$PWD/ci-logs/connector-install/guest") rm -rf -- ci-logs/connector-install/guest ;; *) exit 1 ;; esac
          fi
          if test -d ci-logs/connector-install/image-cache; then
            case "$(realpath ci-logs/connector-install/image-cache)" in "$PWD/ci-logs/connector-install/image-cache") rm -rf -- ci-logs/connector-install/image-cache ;; *) exit 1 ;; esac
          fi
      - name: Bind complete source after installed acceptance
        if: ${{ always() }}
        run: node scripts/capture-connector-source.mjs after
      - name: Upload exact installation receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: connector-install-raw-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-logs
          if-no-files-found: error
          retention-days: 14
      - name: Preserve native offline distribution
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: connector-distribution-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .tmp/connector-release/*.json
            .tmp/connector-release/*.log
            .tmp/connector-release/*.tar.gz
            .tmp/connector-release/*.sh
            .tmp/connector-release/SHA256SUMS
            .tmp/connector-release/installer-*/
            .tmp/connector-upgrade/*.json
            .tmp/connector-upgrade/*.log
            .tmp/connector-upgrade/*.tar.gz
            .tmp/connector-upgrade/*.sh
            .tmp/connector-upgrade/SHA256SUMS
            .tmp/connector-upgrade/installer-*/
          if-no-files-found: warn
          retention-days: 14

  required-ci:
    name: Required CI
    needs: [changes, source-gates, db-integration, api-integration, worker-integration, recovery-integration, agent-smoke, connector-platform, connector-install]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out aggregate policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up exact Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.19.0
      - name: Aggregate required results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          mkdir -p ci-logs
          set -o pipefail
          node scripts/ci-policy.mjs aggregate 2>&1 | tee ci-logs/required-ci.log
      - name: Upload raw aggregate log
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: required-ci-raw-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-logs
          if-no-files-found: error
          retention-days: 14
