name: Promote GA Without Rebuild

on:
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: Passed immutable candidate tag, for example v1.0.0-rc.3
        required: true
        type: string
      ga_tag:
        description: GA tag
        required: true
        default: v1.0.0
        type: string

permissions:
  contents: read

concurrency:
  group: promote-ga-${{ inputs.ga_tag }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  promote:
    name: Promote same immutable image digests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: stable-release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: read
    env:
      CANDIDATE_TAG: ${{ inputs.candidate_tag }}
      GA_TAG: ${{ inputs.ga_tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Validate immutable tag names
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_TAG" =~ ^v1\.0\.0-rc\.[1-9][0-9]*$ ]]
          test "$GA_TAG" = 'v1.0.0'
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.candidate_tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse existing GA records before mutation
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GA_TAG" >/dev/null 2>&1; then
            echo "GA tag already exists: $GA_TAG" >&2
            exit 1
          fi
          if gh release view "$GA_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GA release already exists: $GA_TAG" >&2
            exit 1
          fi
      - name: Download exact candidate release record
        run: |
          mkdir -p release-evidence
          gh release download "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --dir release-evidence
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6
      - name: Verify candidate manifest and detached tag signature
        run: |
          set -euo pipefail
          identity="^https://github.com/${GITHUB_REPOSITORY}/\\.github/workflows/release-candidate\\.yml@refs/tags/${CANDIDATE_TAG}$"
          issuer='https://token.actions.githubusercontent.com'
          cosign verify-blob \
            --certificate-identity-regexp "$identity" \
            --certificate-oidc-issuer "$issuer" \
            --bundle release-evidence/release-manifest.sigstore.json \
            release-evidence/release-manifest.json
          cosign verify-blob \
            --certificate-identity-regexp "$identity" \
            --certificate-oidc-issuer "$issuer" \
            --bundle release-evidence/tag-provenance.sigstore.json \
            release-evidence/tag-provenance.json
      - name: Validate candidate manifest contract
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs'
          const manifest = JSON.parse(readFileSync('release-evidence/release-manifest.json', 'utf8'))
          if (manifest.release.candidateTag !== process.env.CANDIDATE_TAG) throw new Error('Candidate tag mismatch')
          if (!/^[0-9a-f]{40}$/.test(manifest.release.sourceSha)) throw new Error('Invalid source SHA')
          if (manifest.promotion.targetTag !== process.env.GA_TAG) throw new Error('GA target mismatch')
          if (manifest.promotion.rebuildAllowed !== false) throw new Error('Rebuild must be forbidden')
          if (manifest.promotion.requiredDigestEquality !== true) throw new Error('Digest equality must be required')
          const services = Object.keys(manifest.images).sort()
          if (JSON.stringify(services) !== JSON.stringify(['api', 'mcp', 'web', 'worker']))
            throw new Error('Exactly four release images are required')
          appendFileSync(process.env.GITHUB_ENV, `SOURCE_SHA=${manifest.release.sourceSha}\n`)
          NODE
          tag_commit="$(git rev-parse HEAD)"
          test "$tag_commit" = "$SOURCE_SHA"
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PUBLISH_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Verify candidate signatures, SBOMs, and digests
        run: |
          set -euo pipefail
          identity="^https://github.com/${GITHUB_REPOSITORY}/\\.github/workflows/release-candidate\\.yml@refs/tags/${CANDIDATE_TAG}$"
          issuer='https://token.actions.githubusercontent.com'
          for service in api mcp web worker; do
            image="$(node -p "JSON.parse(require('fs').readFileSync('release-evidence/release-manifest.json')).images['$service'].name")"
            digest="$(node -p "JSON.parse(require('fs').readFileSync('release-evidence/release-manifest.json')).images['$service'].digest")"
            observed="sha256:$(docker buildx imagetools inspect "$image@$digest" --raw | sha256sum | cut -d' ' -f1)"
            test "$observed" = "$digest"
            cosign verify \
              --certificate-identity-regexp "$identity" \
              --certificate-oidc-issuer "$issuer" \
              "$image@$digest"
            cosign verify-blob \
              --certificate-identity-regexp "$identity" \
              --certificate-oidc-issuer "$issuer" \
              --bundle "release-evidence/${service}-sbom.sigstore.json" \
              "release-evidence/${service}-sbom.spdx.json"
          done
      - name: Retag exact candidate manifests without build
        run: |
          set -euo pipefail
          mkdir -p promotion-observed
          for service in api mcp web worker; do
            image="$(node -p "JSON.parse(require('fs').readFileSync('release-evidence/release-manifest.json')).images['$service'].name")"
            digest="$(node -p "JSON.parse(require('fs').readFileSync('release-evidence/release-manifest.json')).images['$service'].digest")"
            docker pull "$image@$digest"
            docker tag "$image@$digest" "$image:$GA_TAG"
            docker push "$image:$GA_TAG"
            observed="sha256:$(docker buildx imagetools inspect "$image:$GA_TAG" --raw | sha256sum | cut -d' ' -f1)"
            if [[ "$observed" != "$digest" ]]; then
              echo "PROMOTION_DIGEST_MISMATCH service=$service expected=$digest observed=$observed" >&2
              exit 1
            fi
            printf '%s %s@%s\n' "$service" "$image" "$observed" >> promotion-observed/images.txt
          done
      - name: Create signed promotion record
        run: |
          set -euo pipefail
          manifest_sha="$(sha256sum release-evidence/release-manifest.json | cut -d' ' -f1)"
          printf '{"candidateTag":"%s","gaTag":"%s","commit":"%s","candidateManifestSha256":"%s","rebuild":false}\n' \
            "$CANDIDATE_TAG" "$GA_TAG" "$SOURCE_SHA" "$manifest_sha" \
            > promotion-observed/promotion-record.json
          printf '{"tag":"%s","commit":"%s","promotionRecordSha256":"%s"}\n' \
            "$GA_TAG" "$SOURCE_SHA" \
            "$(sha256sum promotion-observed/promotion-record.json | cut -d' ' -f1)" \
            > promotion-observed/tag-provenance.json
          cosign sign-blob --yes --bundle promotion-observed/promotion-record.sigstore.json promotion-observed/promotion-record.json
          cosign sign-blob --yes --bundle promotion-observed/tag-provenance.sigstore.json promotion-observed/tag-provenance.json
      - name: Create GA tag and release only after digest equality
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            --method POST \
            -f ref="refs/tags/$GA_TAG" \
            -f sha="$SOURCE_SHA" >/dev/null
          gh release create "$GA_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title 'WorkMesh v1.0.0' \
            --notes-file docs/releases/v1.0.0.md \
            release-evidence/release-manifest.json \
            release-evidence/release-manifest.sigstore.json \
            promotion-observed/images.txt \
            promotion-observed/promotion-record.json \
            promotion-observed/promotion-record.sigstore.json \
            promotion-observed/tag-provenance.json \
            promotion-observed/tag-provenance.sigstore.json
      - name: Upload promotion evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ga-promotion-${{ env.GA_TAG }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: promotion-observed
          if-no-files-found: error
          retention-days: 90
