components:
  securitySchemes:
    BootstrapToken:
      {
        type: apiKey,
        in: header,
        name: X-WorkMesh-Bootstrap-Token,
        description: "One-time deployment bootstrap credential. It is required for Workspace installation and is not a human or Agent session.",
      }
    SessionCookie:
      {
        type: apiKey,
        in: cookie,
        name: workmesh_session,
        description: "HttpOnly server-side session cookie.",
      }
    AgentSessionToken:
      {
        type: http,
        scheme: bearer,
        bearerFormat: WorkMeshSessionToken,
        description: "Short-lived agent session token; revocation is checked server-side.",
      }
    AgentInstallationToken:
      {
        type: http,
        scheme: bearer,
        bearerFormat: WorkMeshInstallationToken,
        description: "Installation-scoped bearer credential used by installation_target operations, including token exchange, refresh, and exact-target handoff actions. It cannot perform ordinary session work.",
      }
    GitHubWebhookSignature:
      {
        type: apiKey,
        in: header,
        name: X-Hub-Signature-256,
        description: "GitHub HMAC-SHA256 over the raw request body. X-GitHub-Delivery and X-GitHub-Event are also required and the server enforces its replay and delivery rules.",
      }
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Versioned, signed, opaque continuation cursor. It is bound to the route, workspace, actor, effective filters, and sort tuple; clients must not decode or modify it.
      schema: { type: string, minLength: 1, maxLength: 8192 }
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of authorized items returned in this page.
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Id:
      {
        name: id,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    TeamId:
      {
        name: teamId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    IdempotencyKey:
      {
        name: Idempotency-Key,
        in: header,
        required: true,
        description: "Identifies one logical mutation attempt. Authentication and secret-bearing session mutations retain an encrypted replay for 15 minutes and protect key conflicts for 24 hours. A different operation, canonical request, or client context returns IDEMPOTENCY_KEY_REUSED; an exact retry after the replay window returns IDEMPOTENCY_REPLAY_EXPIRED and must use a new key.",
        schema: { type: string, minLength: 1 },
      }
    CsrfToken:
      {
        name: X-CSRF-Token,
        in: header,
        required: true,
        schema: { type: string, minLength: 1 },
      }
    IfMatch:
      {
        name: If-Match,
        in: header,
        required: true,
        schema: { type: string, pattern: '^"?revision-[1-9][0-9]*"?$' },
      }
    GuidanceIfMatch:
      {
        name: If-Match,
        in: header,
        required: true,
        description: Guidance uses revision-0 as the explicit unpublished resource version.,
        schema: { type: string, pattern: '^"?revision-(?:0|[1-9][0-9]*)"?$' },
      }
    FromGuidanceRevisionId:
      { name: fromRevisionId, in: query, required: true, schema: { type: string, format: uuid } }
    ToGuidanceRevisionId:
      { name: toRevisionId, in: query, required: true, schema: { type: string, format: uuid } }
    CorrelationId:
      {
        name: X-Correlation-Id,
        in: header,
        required: false,
        description: "Optional caller trace value. Use only ASCII letters, digits, dot, underscore, colon, slash, or hyphen; credential-looking prefixes are rejected. Authorization denial audit uses a separate server-generated request id.",
        schema: { type: string, minLength: 1, maxLength: 200, pattern: "^(?![Bb]earer[._:/-]|[Bb]asic[._:/-]|sk[-_]|gh[pousr]_|eyJ[A-Za-z0-9_-]*\\.)[A-Za-z0-9][A-Za-z0-9._:/-]{0,199}$" },
      }
    CursorQuery:
      {
        name: cursor,
        in: query,
        description: Canonical decimal PostgreSQL domain-event cursor; distinct from opaque collection and A2A cursors,
        schema: { $ref: "#/components/schemas/DurableEventCursor" },
      }
    LastEventId:
      {
        name: Last-Event-ID,
        in: header,
        schema: { $ref: "#/components/schemas/DurableEventCursor" },
      }
    EventLimit:
      {
        name: limit,
        in: query,
        schema: { type: integer, minimum: 1, maximum: 500, default: 100 },
      }
    TeamIdQuery:
      { name: teamId, in: query, schema: { type: string, format: uuid } }
    StatusIdQuery:
      { name: statusId, in: query, schema: { type: string, format: uuid } }
    ProjectIdQuery:
      { name: projectId, in: query, schema: { type: string, format: uuid } }
    PriorityQuery:
      {
        name: priority,
        in: query,
        schema: { $ref: "#/components/schemas/Priority" },
      }
    StatusCategoryQuery:
      {
        name: statusCategory,
        in: query,
        schema: { $ref: "#/components/schemas/StatusCategory" },
      }
    ResponsibleHumanActorIdQuery:
      {
        name: responsibleHumanActorId,
        in: query,
        schema: { type: string, format: uuid },
      }
    OwnerIdQuery:
      {
        name: ownerId,
        in: query,
        deprecated: true,
        schema: { type: string, format: uuid },
      }
    MineQuery: { name: mine, in: query, schema: { type: boolean } }
    LabelQuery:
      {
        name: label,
        in: query,
        schema: { type: string, minLength: 1, maxLength: 60 },
      }
    SearchQuery:
      { name: search, in: query, schema: { type: string, minLength: 1 } }
  requestBodies:
    PublishGuidanceInput:
      { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PublishGuidanceInput" } } } }
    ArchiveGuidanceInput:
      { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ArchiveGuidanceInput" } } } }
    RollbackGuidanceInput:
      { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RollbackGuidanceInput" } } } }
    RoomMessageInput:
      { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RoomMessageInput" } } } }
    AcquireLeaseInput:
      { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AcquireLeaseInput" } } } }
    HandoffInput:
      { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/HandoffInput" } } } }
    HandoffAcceptInput:
      { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/HandoffAcceptInput" } } } }
    HandoffRejectInput:
      { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/HandoffRejectInput" } } } }
    DecisionInput:
      { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/DecisionInput" } } } }
    ChildSessionInput:
      { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ChildSessionInput" } } } }
    ContextDeltaInput:
      { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ContextDeltaInput" } } } }
    ReviewDelegationInput:
      { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ReviewDelegationInput" } } } }
    InstallInput:
      {
        required: true,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/InstallInput" } },
          },
      }
    LoginInput:
      {
        required: true,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/LoginInput" } },
          },
      }
    WorkspacePatch:
      {
        required: true,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/WorkspaceInput" } },
          },
      }
    TeamInput:
      {
        required: true,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/TeamInput" } },
          },
      }
    TeamPatch:
      {
        required: true,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/TeamPatch" } },
          },
      }
    WorkflowStateInput:
      {
        required: true,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/WorkflowStateInput" } },
          },
      }
    ProjectInput:
      {
        required: true,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/ProjectInput" } },
