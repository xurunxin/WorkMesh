components:
  securitySchemes:
    SessionCookie:
      {
        type: apiKey,
        in: cookie,
        name: workmesh_session,
        description: HttpOnly server-side session cookie.,
      }
    AgentSessionToken:
      {
        type: http,
        scheme: bearer,
        bearerFormat: WorkMeshSessionToken,
        description: Short-lived agent session token; revocation is checked server-side.,
      }
    AgentInstallationToken:
      {
        type: http,
        scheme: bearer,
        bearerFormat: WorkMeshInstallationToken,
        description: Installation-scoped bearer credential. It cannot perform ordinary session work and is required for session-token refresh.,
      }
  parameters:
    Id:
      {
        name: id,
