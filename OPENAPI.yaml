  schemas:
    RetentionStatus:
      type: object
      additionalProperties: false
      required: [mode, workerSeenAt, workerFresh, policies, floor, archive, jobs, blockers, redis]
      properties:
        mode: { type: string, enum: [unknown, disabled, archive_only, archive_and_prune] }
        workerSeenAt: { type: [string, "null"], format: date-time }
        workerFresh: { type: boolean }
        policies:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [recordClass, onlineDays, conflictDays, archiveDays, deleteAllowed, protectedReason]
            properties:
              recordClass: { type: string }
              onlineDays: { type: integer, minimum: 1 }
              conflictDays: { type: [integer, "null"], minimum: 1 }
              archiveDays: { type: [integer, "null"], minimum: 365 }
              deleteAllowed: { type: boolean }
              protectedReason: { type: [string, "null"] }
        floor:
          type: object
          required: [prunedThroughCursor, updatedAt]
          properties:
            prunedThroughCursor: { type: string, pattern: "^(0|[1-9][0-9]*)$" }
            updatedAt: { type: string, format: date-time }
        archive:
          type: object
          required: [planned, uploaded, verified, pruned, failed, lastVerifiedEndCursor, retainUntil]
          properties:
            planned: { type: integer, minimum: 0 }
            uploaded: { type: integer, minimum: 0 }
            verified: { type: integer, minimum: 0 }
            pruned: { type: integer, minimum: 0 }
