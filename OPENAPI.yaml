openapi: 3.1.0
info:
  title: WorkMesh API
  version: "1.0"
  description: WorkMesh server 1.0.0 REST API 1.0. Non-stable capabilities are deployment-gated and default disabled.
servers:
  - url: http://localhost:3001
security:
  - SessionCookie: []
paths:
  /livez:
    get:
      x-workmesh-policy-id: route.live
      x-workmesh-actor-kinds: []
      x-workmesh-feature-key: none
      x-workmesh-feature-tier: stable
      security: []
      operationId: live
      responses:
        "200":
          description: API process is alive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /readyz:
    get:
      x-workmesh-policy-id: route.ready
      x-workmesh-actor-kinds: []
      x-workmesh-feature-key: none
      x-workmesh-feature-tier: stable
      security: []
      operationId: ready
      responses:
        "200":
          description: API is accepting traffic and its required PostgreSQL and Redis dependencies are reachable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: API is draining or a required dependency is unavailable.
  /health:
    get:
      {
        x-workmesh-policy-id: route.health,
        x-workmesh-actor-kinds: [],
        x-workmesh-feature-key: none,
        x-workmesh-feature-tier: stable,
        security: [],
        operationId: health,
        responses: { "200": { $ref: "#/components/responses/Health" } },
      }
  /api/v1/info:
    get:
      x-workmesh-policy-id: route.getServerInfo
      x-workmesh-actor-kinds: []
      x-workmesh-feature-key: none
      x-workmesh-feature-tier: stable
      security: []
      operationId: getServerInfo
      responses:
        "200":
          description: Safe release, build, protocol, and schema metadata.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [serverVersion, restApiVersion, agentProtocolVersion, mcpVersion, a2aUpstreamVersion, preferredClientProfileVersion, supportedClientProfileVersions, conformanceSuiteVersion, schemaBaseline, buildSha]
                properties:
                  serverVersion: { const: "1.0.0" }
                  restApiVersion: { const: "1.0" }
                  agentProtocolVersion: { const: "1.0" }
                  mcpVersion: { const: "1.0.0" }
                  a2aUpstreamVersion: { const: "0.3" }
                  preferredClientProfileVersion: { const: "1.0" }
                  supportedClientProfileVersions:
                    type: array
                    minItems: 1
                    maxItems: 1
                    items: { const: "1.0" }
                  conformanceSuiteVersion: { const: "1.0" }
                  schemaBaseline: { const: 1 }
                  buildSha: { type: string, minLength: 1, maxLength: 128 }
  /api/v1/features:
    get:
      x-workmesh-policy-id: route.getDeploymentFeatures
      x-workmesh-actor-kinds: [human, agent]
      x-workmesh-feature-key: none
      x-workmesh-feature-tier: stable
      security: [{ SessionCookie: [] }, { AgentSessionToken: [] }]
      operationId: getDeploymentFeatures
      responses:
        "200":
          description: Authenticated feature support tiers and enabled state.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [features]
                properties:
                  features:
                    type: array
                    minItems: 10
                    maxItems: 10
                    items:
                      type: object
                      additionalProperties: false
                      required: [key, tier, enabled]
                      properties:
                        key:
                          type: string
                          enum: [WORKMESH_BETA_PLANNING, WORKMESH_BETA_TEMPLATES, WORKMESH_BETA_COSTS, WORKMESH_BETA_GITEA, WORKMESH_BETA_OPERATIONS_UI, WORKMESH_EXPERIMENTAL_AUTOMATION, WORKMESH_EXPERIMENTAL_AGENT_LOOPS, WORKMESH_EXPERIMENTAL_A2A, WORKMESH_EXPERIMENTAL_EXTERNAL_WEBHOOKS, WORKMESH_EXPERIMENTAL_MULTI_RUNTIME]
                        tier: { type: string, enum: [beta, experimental] }
                        enabled: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/agent-capabilities:
    get:
      x-workmesh-policy-id: route.getAgentCapabilityManifest
      x-workmesh-actor-kinds: [agent]
      x-workmesh-feature-key: none
      x-workmesh-feature-tier: stable
      security: [{ AgentSessionToken: [] }]
      operationId: getAgentCapabilityManifest
      description: Returns protocol support derived from the route-policy, feature, and MCP binding registries for the exact authenticated Agent Session. This response describes support and capability eligibility; every request still performs live authorization.
      parameters:
        - name: WorkMesh-Client-Profile
          in: header
          required: false
          description: Requested Agent Collaboration Client Profile version. Omit to select the preferred version.
          schema: { type: string, enum: ["1.0"] }
      responses:
        "200":
          description: Negotiated capability manifest for the exact Agent Session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentCapabilityManifest" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/install-status:
    get:
      {
        x-workmesh-policy-id: route.getInstallStatus,
        x-workmesh-actor-kinds: [],
        x-workmesh-feature-key: none,
        x-workmesh-feature-tier: stable,
        security: [],
        operationId: getInstallStatus,
        responses:
          { "200": { $ref: "#/components/responses/InstallationStatus" } },
      }
  /api/v1/auth/install:
    post:
      {
        x-workmesh-policy-id: route.installWorkspace,
        x-workmesh-actor-kinds: [],
        x-workmesh-feature-key: none,
        x-workmesh-feature-tier: stable,
        x-workmesh-auth-rate-limit: shared_redis,
        security: [{ BootstrapToken: [] }],
        x-workmesh-secret-replay: encrypted_auth,
        operationId: installWorkspace,
        description: "Authenticated single-use installation. Send the deployment bootstrap credential only in X-WorkMesh-Bootstrap-Token. Exact retries with the same verified credential, idempotency key, request, and client context replay the same encrypted session response for 15 minutes; conflicts remain protected for 24 hours. Reuse with a different request or client context returns IDEMPOTENCY_KEY_REUSED. Exact retry after 15 minutes returns IDEMPOTENCY_REPLAY_EXPIRED. The permanent platform_installation singleton closes all new installation attempts after success.",
        parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }],
        requestBody: { $ref: "#/components/requestBodies/InstallInput" },
        responses:
          {
            "200": { $ref: "#/components/responses/Session" },
            "400": { $ref: "#/components/responses/BadRequest" },
            "401": { $ref: "#/components/responses/BootstrapAuthFailed" },
            "409": { $ref: "#/components/responses/Conflict" },
            "429": { $ref: "#/components/responses/AuthRateLimited" },
            "503": { $ref: "#/components/responses/AuthRateLimitUnavailable" },
          },
      }
  /api/v1/auth/login:
    post:
      {
        x-workmesh-policy-id: route.login,
        x-workmesh-actor-kinds: [],
        x-workmesh-feature-key: none,
        x-workmesh-feature-tier: stable,
        x-workmesh-auth-rate-limit: shared_redis,
        security: [],
        x-workmesh-secret-replay: encrypted_auth,
        operationId: login,
        description: "Credentials are validated before the keyed idempotency claim. Exact successful retries replay the same encrypted cookie/session response for 15 minutes; conflicts remain protected for 24 hours.",
        parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }],
        requestBody: { $ref: "#/components/requestBodies/LoginInput" },
        responses:
          {
            "200": { $ref: "#/components/responses/Session" },
            "400": { $ref: "#/components/responses/BadRequest" },
            "401": { $ref: "#/components/responses/Unauthorized" },
            "409": { $ref: "#/components/responses/Conflict" },
            "429": { $ref: "#/components/responses/AuthRateLimited" },
            "503": { $ref: "#/components/responses/AuthRateLimitUnavailable" },
          },
      }
  /api/v1/auth/logout:
    post:
      {
        x-workmesh-policy-id: route.logout,
        x-workmesh-actor-kinds: [human],
        x-workmesh-feature-key: none,
        x-workmesh-feature-tier: stable,
        security: [{ SessionCookie: [] }],
        x-workmesh-secret-replay: encrypted_auth,
        operationId: logout,
        description: "The first request revokes the human session. An exact retry with the same cookie and key replays the logged-out result without another event; the encrypted replay window is 15 minutes and conflict retention is 24 hours.",
        parameters:
          [
            { $ref: "#/components/parameters/IdempotencyKey" },
            { $ref: "#/components/parameters/CsrfToken" },
          ],
        responses:
          {
            "200": { $ref: "#/components/responses/Ok" },
