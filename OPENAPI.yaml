    patch: { operationId: patchAgentConnection, description: "Update non-privilege-escalating metadata on a Connection. team_id, client_type, requested_capabilities and grant_agent_delegate cannot be changed via PATCH; they require Rotate or Revoke. Requires If-Match to enforce optimistic concurrency.", parameters: [{ $ref: "#/components/parameters/IfMatch" }, { $ref: "#/components/parameters/IdempotencyKey" }], requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AgentConnectionPatchInput" } } } }, responses: { "200": { description: Connection updated, content: { application/json: { schema: { $ref: "#/components/schemas/AgentConnectionResponse" } } } }, "400": { $ref: "#/components/responses/ValidationError" }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { $ref: "#/components/responses/NotFound" }, "409": { $ref: "#/components/responses/RevisionConflict" }, "412": { $ref: "#/components/responses/IfMatchRequired" }, "422": { description: Privilege escalation rejected, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } } } }
    delete: { operationId: revokeAgentConnection, description: "Revoke a Connection. Marks the credential fingerprint revoked, invalidates any live Coordination Session, and emits agent.connection.revoked. Requires If-Match to prevent stale Admin tooling from killing live Connections.", parameters: [{ $ref: "#/components/parameters/IfMatch" }, { $ref: "#/components/parameters/IdempotencyKey" }], responses: { "204": { description: Connection revoked }, "404": { $ref: "#/components/responses/NotFound" }, "409": { $ref: "#/components/responses/RevisionConflict" }, "412": { $ref: "#/components/responses/IfMatchRequired" } } }
  /api/v1/agent-connections/{id}/rotate:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post: { operationId: rotateAgentConnection, description: "Issue a new pairing code and pending credential. Old and new credentials stay valid for 15 minutes. The new redeem succeeds automatically; the old credential is only revoked after the Admin calls /rotate-confirm. The returned connect_url carries the new pairing code in the URL fragment.", parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }], responses: { "201": { description: Rotation issued, content: { application/json: { schema: { $ref: "#/components/schemas/AgentConnectionRotateResponse" } } } }, "404": { $ref: "#/components/responses/NotFound" }, "409": { description: Connection not in a rotatable state, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } } } }
