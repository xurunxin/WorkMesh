openapi: 3.1.0
info:
  title: WorkMesh API
  version: 0.2.0
  description: Human-first work management plus Stage 1 agent execution and Stage 2 durable multi-agent collaboration.
servers:
  - url: http://localhost:3001
security:
  - SessionCookie: []
paths:
  /health:
    get:
      {
        operationId: health,
        security: [],
        responses: { "200": { $ref: "#/components/responses/Health" } },
      }
  /api/v1/install-status:
    get:
      {
        operationId: getInstallStatus,
        security: [],
        responses:
          { "200": { $ref: "#/components/responses/InstallationStatus" } },
      }
  /api/v1/auth/install:
    post:
      {
        operationId: installWorkspace,
        security: [],
        parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }],
        requestBody: { $ref: "#/components/requestBodies/InstallInput" },
        responses:
          {
            "200": { $ref: "#/components/responses/Session" },
            "400": { $ref: "#/components/responses/BadRequest" },
            "409": { $ref: "#/components/responses/Conflict" },
          },
      }
  /api/v1/auth/login:
    post:
      {
        operationId: login,
        security: [],
        parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }],
        requestBody: { $ref: "#/components/requestBodies/LoginInput" },
        responses:
          {
            "200": { $ref: "#/components/responses/Session" },
            "400": { $ref: "#/components/responses/BadRequest" },
            "401": { $ref: "#/components/responses/Unauthorized" },
          },
      }
  /api/v1/auth/logout:
    post:
      {
        operationId: logout,
        parameters:
          [
            { $ref: "#/components/parameters/IdempotencyKey" },
            { $ref: "#/components/parameters/CsrfToken" },
          ],
        responses:
          {
            "200": { $ref: "#/components/responses/Ok" },
            "400": { $ref: "#/components/responses/BadRequest" },
            "401": { $ref: "#/components/responses/Unauthorized" },
            "403": { $ref: "#/components/responses/Forbidden" },
            "409": { $ref: "#/components/responses/Conflict" },
          },
      }
  /api/v1/auth/me:
    get:
      {
        operationId: getCurrentActor,
        responses:
          {
            "200": { $ref: "#/components/responses/AuthMe" },
            "401": { $ref: "#/components/responses/Unauthorized" },
          },
      }
  /api/v1/workspace:
    get:
      {
        operationId: getWorkspace,
        responses:
          {
            "200": { $ref: "#/components/responses/Workspace" },
            "401": { $ref: "#/components/responses/Unauthorized" },
            "404": { $ref: "#/components/responses/NotFound" },
          },
      }
    patch:
      {
        operationId: updateWorkspace,
        parameters:
          [
            { $ref: "#/components/parameters/IdempotencyKey" },
            { $ref: "#/components/parameters/CsrfToken" },
            { $ref: "#/components/parameters/IfMatch" },
          ],
        requestBody: { $ref: "#/components/requestBodies/WorkspacePatch" },
        responses:
          {
            "200": { $ref: "#/components/responses/Command" },
            "400": { $ref: "#/components/responses/BadRequest" },
            "401": { $ref: "#/components/responses/Unauthorized" },
            "403": { $ref: "#/components/responses/Forbidden" },
            "404": { $ref: "#/components/responses/NotFound" },
            "409": { $ref: "#/components/responses/Conflict" },
          },
      }
  /api/v1/teams:
    get:
      {
        operationId: listTeams,
        responses:
          {
            "200": { $ref: "#/components/responses/Teams" },
            "401": { $ref: "#/components/responses/Unauthorized" },
          },
      }
    post:
      {
        operationId: createTeam,
        parameters:
          [
            { $ref: "#/components/parameters/IdempotencyKey" },
            { $ref: "#/components/parameters/CsrfToken" },
          ],
        requestBody: { $ref: "#/components/requestBodies/TeamInput" },
        responses:
          {
            "200": { $ref: "#/components/responses/Command" },
            "400": { $ref: "#/components/responses/BadRequest" },
            "401": { $ref: "#/components/responses/Unauthorized" },
            "403": { $ref: "#/components/responses/Forbidden" },
            "409": { $ref: "#/components/responses/Conflict" },
          },
      }
  /api/v1/teams/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      {
        operationId: updateTeam,
        parameters:
          [
            { $ref: "#/components/parameters/IdempotencyKey" },
            { $ref: "#/components/parameters/CsrfToken" },
            { $ref: "#/components/parameters/IfMatch" },
          ],
        requestBody: { $ref: "#/components/requestBodies/TeamPatch" },
        responses:
          {
            "200": { $ref: "#/components/responses/Command" },
            "400": { $ref: "#/components/responses/BadRequest" },
            "401": { $ref: "#/components/responses/Unauthorized" },
            "403": { $ref: "#/components/responses/Forbidden" },
            "404": { $ref: "#/components/responses/NotFound" },
            "409": { $ref: "#/components/responses/Conflict" },
          },
      }
    delete:
      {
        operationId: deleteTeam,
        parameters:
          [
            { $ref: "#/components/parameters/IdempotencyKey" },
            { $ref: "#/components/parameters/CsrfToken" },
            { $ref: "#/components/parameters/IfMatch" },
          ],
        responses:
          {
            "200": { $ref: "#/components/responses/Command" },
            "400": { $ref: "#/components/responses/BadRequest" },
            "401": { $ref: "#/components/responses/Unauthorized" },
            "403": { $ref: "#/components/responses/Forbidden" },
            "404": { $ref: "#/components/responses/NotFound" },
            "409": { $ref: "#/components/responses/Conflict" },
          },
      }
  /api/v1/teams/{id}/states:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      {
        operationId: listWorkflowStates,
        responses:
          {
            "200": { $ref: "#/components/responses/WorkflowStates" },
            "401": { $ref: "#/components/responses/Unauthorized" },
            "404": { $ref: "#/components/responses/NotFound" },
          },
      }
    post:
      {
        operationId: createWorkflowState,
        parameters:
          [
            { $ref: "#/components/parameters/IdempotencyKey" },
            { $ref: "#/components/parameters/CsrfToken" },
          ],
        requestBody: { $ref: "#/components/requestBodies/WorkflowStateInput" },
        responses:
          {
            "200": { $ref: "#/components/responses/Command" },
            "400": { $ref: "#/components/responses/BadRequest" },
            "401": { $ref: "#/components/responses/Unauthorized" },
            "403": { $ref: "#/components/responses/Forbidden" },
            "404": { $ref: "#/components/responses/NotFound" },
            "409": { $ref: "#/components/responses/Conflict" },
          },
      }
  /api/v1/projects:
    get:
      {
        operationId: listProjects,
        responses:
          {
            "200": { $ref: "#/components/responses/Projects" },
            "401": { $ref: "#/components/responses/Unauthorized" },
          },
      }
    post:
      {
        operationId: createProject,
        parameters:
          [
            { $ref: "#/components/parameters/IdempotencyKey" },
            { $ref: "#/components/parameters/CsrfToken" },
          ],
        requestBody: { $ref: "#/components/requestBodies/ProjectInput" },
        responses:
          {
            "200": { $ref: "#/components/responses/Command" },
            "400": { $ref: "#/components/responses/BadRequest" },
            "401": { $ref: "#/components/responses/Unauthorized" },
            "403": { $ref: "#/components/responses/Forbidden" },
            "404": { $ref: "#/components/responses/NotFound" },
            "409": { $ref: "#/components/responses/Conflict" },
          },
      }
  /api/v1/projects/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      {
        operationId: getProject,
        responses:
          {
            "200": { $ref: "#/components/responses/Project" },
            "401": { $ref: "#/components/responses/Unauthorized" },
            "404": { $ref: "#/components/responses/NotFound" },
          },
      }
    patch:
      {
        operationId: updateProject,
        parameters:
          [
            { $ref: "#/components/parameters/IdempotencyKey" },
            { $ref: "#/components/parameters/CsrfToken" },
            { $ref: "#/components/parameters/IfMatch" },
          ],
        requestBody: { $ref: "#/components/requestBodies/ProjectPatch" },
        responses:
          {
            "200": { $ref: "#/components/responses/Command" },
            "400": { $ref: "#/components/responses/BadRequest" },
            "401": { $ref: "#/components/responses/Unauthorized" },
            "403": { $ref: "#/components/responses/Forbidden" },
            "404": { $ref: "#/components/responses/NotFound" },
            "409": { $ref: "#/components/responses/Conflict" },
          },
      }
    delete:
      {
        operationId: deleteProject,
        parameters:
          [
            { $ref: "#/components/parameters/IdempotencyKey" },
            { $ref: "#/components/parameters/CsrfToken" },
            { $ref: "#/components/parameters/IfMatch" },
          ],
        responses:
          {
            "200": { $ref: "#/components/responses/Command" },
            "400": { $ref: "#/components/responses/BadRequest" },
            "401": { $ref: "#/components/responses/Unauthorized" },
            "403": { $ref: "#/components/responses/Forbidden" },
            "404": { $ref: "#/components/responses/NotFound" },
            "409": { $ref: "#/components/responses/Conflict" },
          },
      }
  /api/v1/actors/humans:
    get:
      {
        operationId: listHumanActors,
        responses:
          {
            "200": { $ref: "#/components/responses/HumanActors" },
            "401": { $ref: "#/components/responses/Unauthorized" },
          },
      }
  /api/v1/work-items:
    get:
      {
        operationId: listWorkItems,
        parameters:
          [
            { $ref: "#/components/parameters/TeamIdQuery" },
            { $ref: "#/components/parameters/StatusIdQuery" },
            { $ref: "#/components/parameters/ProjectIdQuery" },
            { $ref: "#/components/parameters/PriorityQuery" },
            { $ref: "#/components/parameters/StatusCategoryQuery" },
            { $ref: "#/components/parameters/ResponsibleHumanActorIdQuery" },
            { $ref: "#/components/parameters/OwnerIdQuery" },
            { $ref: "#/components/parameters/MineQuery" },
            { $ref: "#/components/parameters/LabelQuery" },
            { $ref: "#/components/parameters/SearchQuery" },
          ],
        responses:
          {
            "200": { $ref: "#/components/responses/WorkItems" },
            "400": { $ref: "#/components/responses/BadRequest" },
            "401": { $ref: "#/components/responses/Unauthorized" },
          },
      }
    post:
      {
        operationId: createWorkItem,
        parameters:
          [
            { $ref: "#/components/parameters/IdempotencyKey" },
            { $ref: "#/components/parameters/CsrfToken" },
          ],
        requestBody: { $ref: "#/components/requestBodies/WorkItemInput" },
        responses:
          {
            "200": { $ref: "#/components/responses/Command" },
            "400": { $ref: "#/components/responses/BadRequest" },
            "401": { $ref: "#/components/responses/Unauthorized" },
            "403": { $ref: "#/components/responses/Forbidden" },
            "404": { $ref: "#/components/responses/NotFound" },
            "409": { $ref: "#/components/responses/Conflict" },
          },
      }
  /api/v1/work-items/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      {
        operationId: getWorkItem,
        responses:
          {
            "200": { $ref: "#/components/responses/WorkItem" },
            "401": { $ref: "#/components/responses/Unauthorized" },
            "404": { $ref: "#/components/responses/NotFound" },
          },
      }
    patch:
      {
        operationId: updateWorkItem,
        parameters:
          [
            { $ref: "#/components/parameters/IdempotencyKey" },
            { $ref: "#/components/parameters/CsrfToken" },
            { $ref: "#/components/parameters/IfMatch" },
          ],
        requestBody: { $ref: "#/components/requestBodies/WorkItemPatch" },
        responses:
          {
            "200": { $ref: "#/components/responses/Command" },
            "400": { $ref: "#/components/responses/BadRequest" },
            "401": { $ref: "#/components/responses/Unauthorized" },
            "403": { $ref: "#/components/responses/Forbidden" },
            "404": { $ref: "#/components/responses/NotFound" },
            "409": { $ref: "#/components/responses/Conflict" },
          },
      }
    delete:
      {
        operationId: deleteWorkItem,
        parameters:
          [
            { $ref: "#/components/parameters/IdempotencyKey" },
            { $ref: "#/components/parameters/CsrfToken" },
            { $ref: "#/components/parameters/IfMatch" },
          ],
        responses:
          {
            "200": { $ref: "#/components/responses/Command" },
            "400": { $ref: "#/components/responses/BadRequest" },
            "401": { $ref: "#/components/responses/Unauthorized" },
            "403": { $ref: "#/components/responses/Forbidden" },
            "404": { $ref: "#/components/responses/NotFound" },
            "409": { $ref: "#/components/responses/Conflict" },
          },
      }
  /api/v1/work-items/{id}/comments:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      {
        operationId: listWorkItemComments,
        responses:
          {
            "200": { $ref: "#/components/responses/Comments" },
            "401": { $ref: "#/components/responses/Unauthorized" },
            "404": { $ref: "#/components/responses/NotFound" },
          },
      }
    post:
      {
        operationId: createComment,
        parameters:
          [
            { $ref: "#/components/parameters/IdempotencyKey" },
            { $ref: "#/components/parameters/CsrfToken" },
          ],
        requestBody: { $ref: "#/components/requestBodies/CommentInput" },
        responses:
          {
            "200": { $ref: "#/components/responses/Command" },
            "400": { $ref: "#/components/responses/BadRequest" },
            "401": { $ref: "#/components/responses/Unauthorized" },
            "403": { $ref: "#/components/responses/Forbidden" },
            "404": { $ref: "#/components/responses/NotFound" },
            "409": { $ref: "#/components/responses/Conflict" },
          },
      }
  /api/v1/comments/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      {
        operationId: updateComment,
        parameters:
          [
            { $ref: "#/components/parameters/IdempotencyKey" },
            { $ref: "#/components/parameters/CsrfToken" },
            { $ref: "#/components/parameters/IfMatch" },
          ],
        requestBody: { $ref: "#/components/requestBodies/CommentPatch" },
        responses:
          {
            "200": { $ref: "#/components/responses/Command" },
            "400": { $ref: "#/components/responses/BadRequest" },
            "401": { $ref: "#/components/responses/Unauthorized" },
            "403": { $ref: "#/components/responses/Forbidden" },
            "404": { $ref: "#/components/responses/NotFound" },
            "409": { $ref: "#/components/responses/Conflict" },
          },
      }
  /api/v1/views:
    get:
      {
        operationId: listSavedViews,
        responses:
          {
            "200": { $ref: "#/components/responses/SavedViews" },
            "401": { $ref: "#/components/responses/Unauthorized" },
          },
      }
    post:
      {
        operationId: createSavedView,
        parameters:
          [
            { $ref: "#/components/parameters/IdempotencyKey" },
            { $ref: "#/components/parameters/CsrfToken" },
          ],
        requestBody: { $ref: "#/components/requestBodies/SavedViewInput" },
        responses:
          {
            "200": { $ref: "#/components/responses/Command" },
            "400": { $ref: "#/components/responses/BadRequest" },
            "401": { $ref: "#/components/responses/Unauthorized" },
            "403": { $ref: "#/components/responses/Forbidden" },
            "409": { $ref: "#/components/responses/Conflict" },
          },
      }
  /api/v1/events:
    get:
      {
        operationId: listEvents,
        parameters: [{ $ref: "#/components/parameters/CursorQuery" }],
        responses:
          {
            "200": { $ref: "#/components/responses/Events" },
            "400": { $ref: "#/components/responses/BadRequest" },
            "401": { $ref: "#/components/responses/Unauthorized" },
          },
      }
  /api/v1/events/stream:
    get:
      {
        operationId: streamEvents,
        parameters:
          [
            { $ref: "#/components/parameters/CursorQuery" },
            { $ref: "#/components/parameters/LastEventId" },
          ],
        responses:
          {
            "200": { $ref: "#/components/responses/EventStream" },
            "400": { $ref: "#/components/responses/BadRequest" },
            "401": { $ref: "#/components/responses/Unauthorized" },
          },
      }
  /api/v1/agents:
    get:
      {
        operationId: listAgents,
        responses:
          {
            "200": { $ref: "#/components/responses/Agents" },
            "401": { $ref: "#/components/responses/Unauthorized" },
          },
      }
  /api/v1/agents/register:
    post:
      {
        operationId: registerAgent,
        parameters:
          [
            { $ref: "#/components/parameters/IdempotencyKey" },
            { $ref: "#/components/parameters/CorrelationId" },
          ],
        requestBody:
          { $ref: "#/components/requestBodies/AgentRegistrationInput" },
        responses:
          {
            "201": { $ref: "#/components/responses/Agent" },
            "400": { $ref: "#/components/responses/BadRequest" },
            "409": { $ref: "#/components/responses/Conflict" },
          },
      }
  /api/v1/agents/{id}:
    get:
      {
        operationId: getAgent,
        parameters: [{ $ref: "#/components/parameters/Id" }],
        responses:
          {
            "200": { $ref: "#/components/responses/Agent" },
            "404": { $ref: "#/components/responses/NotFound" },
          },
      }
    patch:
      {
        operationId: updateAgent,
        parameters:
          [
            { $ref: "#/components/parameters/Id" },
            { $ref: "#/components/parameters/IdempotencyKey" },
            { $ref: "#/components/parameters/IfMatch" },
            { $ref: "#/components/parameters/CorrelationId" },
          ],
        requestBody: { $ref: "#/components/requestBodies/AgentPatch" },
        responses:
          {
            "200": { $ref: "#/components/responses/Agent" },
            "400": { $ref: "#/components/responses/BadRequest" },
            "409": { $ref: "#/components/responses/Conflict" },
          },
      }
  /api/v1/agents/{id}/team-access/{teamId}:
    put:
      {
        operationId: approveAgentTeamAccess,
        description: Workspace admin grants a requested capability subset for one team.,
        parameters:
          [
            { $ref: "#/components/parameters/Id" },
            { $ref: "#/components/parameters/TeamId" },
            { $ref: "#/components/parameters/IdempotencyKey" },
            { $ref: "#/components/parameters/CorrelationId" },
          ],
        requestBody:
          { $ref: "#/components/requestBodies/AgentTeamAccessInput" },
        responses:
          {
            "200": { $ref: "#/components/responses/AgentTeamAccess" },
            "400": { $ref: "#/components/responses/BadRequest" },
            "403": { $ref: "#/components/responses/Forbidden" },
            "404": { $ref: "#/components/responses/NotFound" },
            "409": { $ref: "#/components/responses/Conflict" },
          },
      }
    delete:
      {
        operationId: revokeAgentTeamAccess,
        description: Workspace admin immediately revokes an agent's access to one team.,
        parameters:
          [
            { $ref: "#/components/parameters/Id" },
            { $ref: "#/components/parameters/TeamId" },
            { $ref: "#/components/parameters/IdempotencyKey" },
            { $ref: "#/components/parameters/CorrelationId" },
          ],
        responses:
          {
            "200": { $ref: "#/components/responses/AgentTeamAccess" },
            "403": { $ref: "#/components/responses/Forbidden" },
            "404": { $ref: "#/components/responses/NotFound" },
            "409": { $ref: "#/components/responses/Conflict" },
          },
      }
  /api/v1/work-items/{id}/delegations:
    post:
      {
        operationId: createDelegation,
        parameters:
          [
            { $ref: "#/components/parameters/Id" },
            { $ref: "#/components/parameters/IdempotencyKey" },
            { $ref: "#/components/parameters/IfMatch" },
            { $ref: "#/components/parameters/CorrelationId" },
          ],
        requestBody: { $ref: "#/components/requestBodies/DelegationInput" },
        responses:
          {
            "201": { $ref: "#/components/responses/Delegation" },
            "400": { $ref: "#/components/responses/BadRequest" },
            "409": { $ref: "#/components/responses/Conflict" },
          },
      }
  /api/v1/work-items/{id}/agent-session:
    post:
      {
        operationId: delegateAndStartAgentSession,
        description: Atomically create an executor delegation and its initial queued session for this work item.,
        parameters:
          [
            { $ref: "#/components/parameters/Id" },
            { $ref: "#/components/parameters/IdempotencyKey" },
            { $ref: "#/components/parameters/IfMatch" },
            { $ref: "#/components/parameters/CorrelationId" },
          ],
        requestBody:
          {
            $ref: "#/components/requestBodies/DelegateAndStartAgentSessionInput",
          },
        responses:
          {
            "201":
              { $ref: "#/components/responses/DelegateAndStartAgentSession" },
            "400": { $ref: "#/components/responses/BadRequest" },
            "403": { $ref: "#/components/responses/Forbidden" },
            "409": { $ref: "#/components/responses/Conflict" },
          },
      }
  /api/v1/delegations/{id}:
    get:
      {
        operationId: getDelegation,
        parameters: [{ $ref: "#/components/parameters/Id" }],
        responses:
          {
            "200": { $ref: "#/components/responses/Delegation" },
            "404": { $ref: "#/components/responses/NotFound" },
          },
      }
  /api/v1/delegations/{id}/revoke:
    post:
      {
        operationId: revokeDelegation,
        parameters:
          [
            { $ref: "#/components/parameters/Id" },
            { $ref: "#/components/parameters/IdempotencyKey" },
            { $ref: "#/components/parameters/IfMatch" },
            { $ref: "#/components/parameters/CorrelationId" },
          ],
        requestBody: { $ref: "#/components/requestBodies/ReasonInput" },
        responses:
          {
            "200": { $ref: "#/components/responses/Delegation" },
            "409": { $ref: "#/components/responses/Conflict" },
          },
      }
  /api/v1/agent-sessions:
    get:
      {
        operationId: listAgentSessions,
        parameters:
          [
            { name: teamId, in: query, schema: { type: string, format: uuid } },
            {
              name: workItemId,
              in: query,
              schema: { type: string, format: uuid },
            },
            {
              name: agentId,
              in: query,
              schema: { type: string, format: uuid },
            },
            {
              name: principalHumanActorId,
              in: query,
              schema: { type: string, format: uuid },
            },
            {
              name: state,
              in: query,
              schema: { $ref: "#/components/schemas/AgentSessionState" },
            },
          ],
        responses: { "200": { $ref: "#/components/responses/AgentSessions" } },
      }
    post:
      {
        operationId: createAgentSession,
        parameters:
          [
            { $ref: "#/components/parameters/IdempotencyKey" },
            { $ref: "#/components/parameters/CorrelationId" },
          ],
        requestBody:
          { $ref: "#/components/requestBodies/CreateAgentSessionInput" },
        responses:
          {
            "201": { $ref: "#/components/responses/AgentSession" },
            "400": { $ref: "#/components/responses/BadRequest" },
