    HandoffRejectInput:
      type: object
      additionalProperties: false
      anyOf:
        - required: [reason]
        - required: [machineReason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 10000, description: Human rejection rationale. }
        machineReason: { type: string, enum: [capability_missing, budget_insufficient, concurrency_limit, context_incomplete, conflict, manual_reject] }
    DecisionInput:
      { type: object, required: [title, rationale], properties: { title: { type: string }, rationale: { type: string }, options: { type: array, items: { type: string } }, selectedOption: { type: string }, evidence: { type: array, items: { type: string } }, affectedResources: { type: array, items: { type: object, required: [resourceType, resourceId], properties: { resourceType: { type: string, enum: [work_item, plan_step, artifact, session] }, resourceId: { type: string, format: uuid }, impact: { type: string } } } }, sessionId: { type: string, format: uuid } } }
    ChildSessionInput:
