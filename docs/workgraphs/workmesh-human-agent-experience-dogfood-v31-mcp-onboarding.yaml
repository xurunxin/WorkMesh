      coordination_feature_binding_repair_rounds: 1
      coordination_feature_binding_gate_attempts: 1
      coordination_production_compensation_repair_rounds: 1
      coordination_production_compensation_gate_attempts: 1
      coordination_feature_activation_attempts: 1
      active_browser_attempts: 2
      mcp_fixture_mutations: 4
