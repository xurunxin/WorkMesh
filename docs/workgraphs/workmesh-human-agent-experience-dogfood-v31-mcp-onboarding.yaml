    objective: "Deliver GEN-11 as an authority-safe Human MCP onboarding and diagnostics experience, and dogfood the exact Human-to-Agent connection journey without weakening WorkMesh identity, Session, Delegation, capability, revision, idempotency, event, or service boundaries."
