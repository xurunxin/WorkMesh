      - artifacts/implementation/dogfood-v31-attempt-2-supervisor-binding-failure.json
      - artifacts/implementation/dogfood-v31-versioned-supervisor-binding-repair.json
      - artifacts/runtime/dogfood-v31-stack-activation-contract-attempt-3.json
      - artifacts/gates/dogfood-v31-versioned-supervisor-binding-repair-gate.yaml
      - artifacts/design/human-journey-attempt-31/active-acceptance.json
      - artifacts/implementation/dogfood-v31-coordination-feature-binding-repair.json
      - artifacts/runtime/dogfood-v31-coordination-feature-activation-contract.json
      - artifacts/gates/dogfood-v31-coordination-feature-binding-gate.yaml
      - artifacts/plans/dogfood-v31-coordination-compensation-graph-amendment-proposal.json
      - artifacts/approvals/dogfood-v31-coordination-compensation-graph-amendment-approval.json
      - artifacts/implementation/dogfood-v31-coordination-production-compensation-repair.json
      - artifacts/runtime/dogfood-v31-coordination-feature-activation-contract-attempt-2.json
      - artifacts/gates/dogfood-v31-coordination-feature-binding-gate-attempt-2.yaml
      - artifacts/approvals/dogfood-v31-coordination-feature-activation-request.json
      - artifacts/approvals/dogfood-v31-coordination-feature-activation-human-approval.json
      - artifacts/runtime/dogfood-v31-coordination-feature-activation.json
      - artifacts/design/human-journey-attempt-31/active-acceptance-attempt-2.json
      - artifacts/workmesh/dogfood-v31-gen11-completion.json
    acceptance:
      - id: V31-G1
        assertion: "The exact active v30 source/build/runtime, GEN-10 Done revision 3, GEN-11 Backlog revision 1, package/lock hashes, and rollback selectors are frozen before implementation."
        evidence_type: api_state
        source_of_truth: "WorkMesh MCP, live runtime, and canonical source/build audit"
      - id: V31-G2
        assertion: "A Human can select a supported MCP client and obtain endpoint, transport, profile, pinned Skill, capability, and secret-store guidance from server-derived facts without any credential appearing in DOM, logs, screenshots, or persisted evidence."
        evidence_type: test
        source_of_truth: "Web UI, discovery/profile contracts, and bounded secret-leak audit"
      - id: V31-G3
        assertion: "Pending, expired, active, rotating, revoked, mis-scoped, unsupported-client, and unavailable-service connection states are distinct, truthful, recoverable, and never infer authority from frontend availability."
        evidence_type: test
        source_of_truth: "API projections, component tests, and Browser evidence"
      - id: V31-G4
        assertion: "The real onboarding path preserves Human principal, Agent Connection, installation identity, Agent Session, Delegation, and capability scope as separate identities and calls verify_connection before work begins."
        evidence_type: api_state
        source_of_truth: "WorkMesh MCP and durable Agent Connection records"
      - id: V31-G5
        assertion: "Human credentials, pairing fragments, installation tokens, exchange tokens, Session tokens, and authorization headers are never treated as interchangeable and are absent from activities, artifacts, screenshots, request logs, and client configuration persisted by WorkMesh."
        evidence_type: test
        source_of_truth: "authorization tests and redacted evidence audit"
      - id: V31-G6
        assertion: "REST, MCP, discovery, Skill, client-profile, route-policy, and feature-gate contracts remain versioned and fail closed for expired, revoked, mis-scoped, unsupported, or disabled coordination access."
        evidence_type: test
        source_of_truth: "contracts, API/MCP tests, and route-policy checks"
      - id: V31-G7
        assertion: "The primary Human onboarding and diagnostics journey is keyboard-accessible, responsive at 1280, 375, and 320 widths, has explicit loading/empty/error/forbidden/expired/revoked states, and has no horizontal document overflow."
        evidence_type: review
        source_of_truth: "one fresh in-app Browser journey and exact screenshots/DOM evidence"
      - id: V31-G8
        assertion: "Local tests, typecheck, lint, route-policy, focused integration, candidate build, bundle budget, runtime invariance, and cleanup all pass without package/lock drift unless separately Gate-approved."
        evidence_type: test
        source_of_truth: "isolated local verification and runtime readback"
      - id: V31-G9
        assertion: "After an exact Human Gate, the full stack activates with bounded compensation and the active Human plus Agent journey proves the candidate build while protected service and data boundaries remain healthy."
        evidence_type: review
        source_of_truth: "activation receipt, active Browser/MCP evidence, runtime and database windows"
      - id: V31-G10
        assertion: "Only GEN-11 moves from Backlog revision 1 through In Progress revision 2 to Done revision 3 with coord:completed, identical MCP replay, readback, and one durable event per transition."
        evidence_type: api_state
        source_of_truth: "WorkMesh MCP and durable event cursors"
    constraints:
      - "PowerShell execution uses pwsh.exe only."
      - "No Git mutation, no GitHub CI, no security scan, and no secret values in artifacts."
      - "PostgreSQL remains authoritative; MCP and Web add no policy or credential authority."
      - "Candidate writes stay in one isolated v31 root; active replacement requires an exact Human Gate."
      - "Browser evidence uses the in-app Browser, one fresh tab per authorized attempt, viewport reset, and exactly-once finalize."
      - "Security-sensitive behavior is covered by targeted authorization and redaction tests, but no security approval is claimed."
    permissions:
      read: [active_v30_source, active_runtime, WorkMesh_MCP, WorkMesh_API, repository_specs]
      write: [v31_candidate_source, versioned_artifacts, v31_execution_state, exact_GEN11_WorkMesh_fields]
      external_mutation: [exact_GEN11_start_and_completion, Human_approved_v31_activation, Human_approved_bounded_connection_fixture]
      prohibited: [Git_mutation, GitHub_CI, broad_security_scan, hidden_chain_of_thought, unrelated_WorkMesh_mutation]
    budgets:
      max_write_parallel: 1
      graph_gate_attempts: 2
      mcp_start_mutations: 1
      implementation_rounds: 3
      implementation_gate_attempts: 2
      candidate_browser_attempts: 2
