        - provider
        - connectionId
        - repositoryId
        - requesterActorId
        - sessionId
        - workItemId
        - projectId
        - planStepId
        - expectedHeadSha
        - approvalId
        - status
        - effect
        - artifactIds
        - createdAt
        - updatedAt
        - completedAt
        - error
        - recovery
        - kind
        - target
        - result
        properties:
          id: *id001
