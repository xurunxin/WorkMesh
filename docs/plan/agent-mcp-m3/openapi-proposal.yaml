paths:
  /api/v1/provider-actions/{id}:
    get:
      operationId: getProviderAction
      x-workmesh-policy-id: route.getProviderAction
      x-workmesh-actor-kinds:
      - human
      - agent
      x-workmesh-feature-key: none
      x-workmesh-feature-tier: stable
      security:
      - SessionCookie: []
      - AgentSessionToken: []
      parameters:
      - name: id
        in: path
        required: true
        schema: &id001
          type: string
          format: uuid
      description: Proposed：严格空query；准确原requester/principal/Session/资源只读确认。ordinary
        terminal E拒绝。Gitea仍按WORKMESH_BETA_GITEA动态门禁。
      responses:
        '200':
          description: 白名单原action投影；GET不刷新Token、不写业务事实
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderActionProjection'
        '401':
          description: 凭据无效
        '403':
          description: 有效身份的状态/能力/部署门禁拒绝；不泄漏隐藏target
        '404':
          description: 目标不存在或不可见
  /api/v1/projects/{id}/delivery:
    get:
      operationId: getProjectDelivery
      x-additive-parameters:
      - name: pullRequestId
        in: query
        schema: *id001
      description: 默认旧envelope保留；新增参数精确当前head，scope取数前过滤、完整阻断事实。
components:
  schemas:
    ProviderActionProjection:
