            maxItems: 100
            uniqueItems: true
            items: *id001
          createdAt: &id002
            type: string
            format: date-time
          updatedAt: *id002
          completedAt: &id015
            anyOf:
            - *id002
            - type: 'null'
          error: &id016
            anyOf:
            - type: object
              additionalProperties: false
              required:
              - code
              properties:
                code:
                  type: string
                  enum:
                  - PROVIDER_ACTION_FAILED
                  - PROVIDER_ACTION_AUTHORITY_REVOKED
                  - PROVIDER_HEAD_SHA_MISMATCH
                  - MERGE_APPROVAL_MISMATCH
                  - MERGE_APPROVAL_EXPIRED
                  - MERGE_CHECKS_BLOCKED
                  - PROVIDER_CAPABILITY_UNSUPPORTED
                  - PROVIDER_ACTION_CLAIM_LOST
                  - RESULT_UNAVAILABLE
            - type: 'null'
          recovery: &id017
            type: object
            additionalProperties: false
            required:
            - kind
            - scheduled
            - nextQueryAt
            properties:
              kind:
                type: string
                enum:
                - none
                - poll_same_action
                - human_reconcile
